[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unloop-music"
version = "0.10.0.dev0"
description = "A local-first, provider-agnostic music discovery engine that optimizes for novelty instead of repetition."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "UNLOOP contributors" }]
keywords = ["music", "recommendations", "spotify", "listenbrainz", "musicbrainz", "discovery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
unloop = "unloop.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/unloop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/unloop/api/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["unloop"]
